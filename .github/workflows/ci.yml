name: CI

# Type checks, production builds and the server test suite on every push
# and pull request. The tests start the compiled server against throwaway
# databases; the PDF test renders with the bundled @sparticuz/chromium build.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install
        run: |
          npm ci --prefix server
          npm ci --prefix client --include=dev

      - name: Type-check and build the client
        run: |
          cd client
          npx tsc --noEmit
          npx vite build

      - name: Build and test the server
        run: npm test --prefix server
