services:
  - type: web
    name: krafo
    runtime: node
    buildCommand: npm install --prefix server && npm install --prefix client --include=dev && npm run build --prefix server && npm run build --prefix client && (node scripts/prerender.cjs || echo '[prerender] skipped')
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/google-chrome-stable
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /data/krafo.db
      - key: UPLOAD_DIR
        value: /data/uploads

      # Frontend URL - used in email links (invites, unsubscribe, onboarding)
      - key: FRONTEND_URL
        value: https://kraafo.com

      # JWT signing secret - set a strong random value in the Render dashboard
      - key: JWT_SECRET
        sync: false

      # Admin panel password - set a strong secret in the Render dashboard
      - key: ADMIN_TOKEN
        sync: false

      # AI - Smart Fill & document import (set in Render dashboard)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # Cloudflare Turnstile - bot protection on signup, feedback, subscribe forms
      - key: TURNSTILE_SECRET
        sync: false
      - key: VITE_TURNSTILE_SITEKEY
        sync: false

      # Email via Resend (invoice delivery, welcome & broadcast emails)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: invoices@kraafo.com
      - key: RESEND_MARKETING_FROM
        value: hello@kraafo.com

      # Admin event alerts (new signups, revenue milestones)
      - key: ADMIN_ALERT_EMAIL
        sync: false

      # Sentry error monitoring
      - key: SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false

    disk:
      name: krafo-data
      mountPath: /data
      sizeGB: 1
